[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# The sample documents are long sentences of prose stored as data; wrapping them would hurt readability.
"tools/make_sample_pdfs.py" = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's normal way to declare a dependency is a default argument; tell ruff that is fine.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
